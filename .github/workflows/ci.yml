name: Build and rendering tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rendering:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - name: Compile host test runner
        run: >-
          g++ -std=c++11 -D__LINUX__ -O2
          tests/decoder_test.cpp LilyGo_GifPlayer/src/AnimatedGIF/AnimatedGIF.cpp
          -o tests/decoder_test
      - name: Compare frames with Pillow
        run: python tests/test_gifs.py
      - name: Check playback timing and decoder regressions
        run: |
          g++ -std=c++11 tests/timing_test.cpp -o /tmp/timing_test
          /tmp/timing_test
          python tests/test_regressions.py
      - name: Check malformed GIFs with AddressSanitizer
        run: |
          g++ -std=c++11 -D__LINUX__ -O1 -g -fsanitize=address -fno-omit-frame-pointer \
            tests/decoder_test.cpp LilyGo_GifPlayer/src/AnimatedGIF/AnimatedGIF.cpp \
            -o /tmp/decoder_sanitized
          DECODER_TEST=/tmp/decoder_sanitized python tests/test_regressions.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lilygo-device-check
          path: |
            tests/fixtures/device/gif/*.gif
            docs/HARDWARE_CHECK_RU.md
          if-no-files-found: error
          retention-days: 30

  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
        with:
          version: '1.3.1'
      - name: Install pinned platform and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17
          arduino-cli lib update-index
          arduino-cli lib install --no-deps 'LilyGo-T-RGB@1.0.5' 'SensorLib@0.2.3' 'lvgl@8.3.11'
          python -m pip install pyserial reedsolo bitstring ecdsa intelhex
      - name: Compile ESP32-S3 firmware
        run: >-
          arduino-cli compile
          --fqbn 'esp32:esp32:esp32s3:USBMode=hwcdc,CDCOnBoot=cdc,FlashSize=16M,FlashMode=qio,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi'
          --output-dir build/firmware LilyGo_GifPlayer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: esp32s3-build-output
          path: build/firmware/*.bin
          if-no-files-found: error
          retention-days: 14

  initial-release:
    name: Publish v1.0.0 after successful checks
    needs: [rendering, firmware]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: initial-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Publish first source release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo 'v1.0.0 already exists; leaving it unchanged.'
          else
            gh release create v1.0.0 --target "$RELEASE_COMMIT" \
              --title 'v1.0.0 — First working release' \
              --notes-file docs/RELEASE_v1.0.0.md
          fi
